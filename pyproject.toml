[project]
name = "finance-context-agent"
version = "0.1.0"
description = "Answer financial questions over finance-context-builder slices"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "httpx>=0.28",
    "langgraph>=1.0",
    "langgraph-checkpoint-redis>=0.5.2,<0.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2.1",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_context_agent"]

[project.scripts]
finance-context-agent = "finance_context_agent.app:main"

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
