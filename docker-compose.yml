services:
  agent:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8090}:${PORT:-8090}"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-8090}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-devpassword}@redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; port=os.environ.get('PORT') or '8090'; urllib.request.urlopen('http://127.0.0.1:%s/healthz' % port)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:8
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:-devpassword}
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-devpassword}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
